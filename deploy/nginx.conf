# Plan It behind nginx with certificates from certbot.
# Replace planit.example.com and the certificate paths.
# The app must not be reachable except through this proxy.

server {
    listen 80;
    server_name planit.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name planit.example.com;

    ssl_certificate     /etc/letsencrypt/live/planit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planit.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # One 2 MB CSV plus multipart overhead; the app rejects anything over 3 MB.
    client_max_body_size 4m;
    client_body_timeout 120s;
    client_header_timeout 30s;
    send_timeout 300s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/planit-access.log;
    error_log  /var/log/nginx/planit-error.log;
}
